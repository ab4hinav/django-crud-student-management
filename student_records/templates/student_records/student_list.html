<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .add-button {
            display: inline-block;
            background-color: #198754;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #343a40;
            color: white;
        }

        .edit {
            background-color: #0d6efd;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete {
            background-color: #dc3545;
            color: white;
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <a class="add-button" href="{% url 'student_create' %}">
        + Add Student
    </a>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.age }}</td>

            <td>
                <a class="edit"
                   href="{% url 'student_update' student.id %}">
                    Edit
                </a>

                <form method="POST"
                      action="{% url 'student_delete' student.id %}"
                      style="display:inline;">

                    {% csrf_token %}

                    <button class="delete" type="submit">
                        Delete
                    </button>

                </form>
            </td>
        </tr>

        {% empty %}

        <tr>
            <td class="empty" colspan="6">
                No students found. Add your first student!
            </td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
